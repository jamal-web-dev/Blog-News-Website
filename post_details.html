<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Details | Full Detailed Post</title>
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="stylesheet" href="styles/post_details.css">
</head>
<body>
  <header></header>
  <section>
    <div class="post-title">
      <img id="postImg" src="images/news1.png" alt="">
      <h2 id="postHeader">How Did van Gogh’s Turbulent Mind Depict One of the Most</h2>
    </div>
    <div class="post-details">
      <p id="postBody">Loading post contents...</p>
    </div>
    <button id="backBtn">Back To Home</button>
  </section>


  <footer>
    <span class="logo">
      Blog<span>Lab</span>
    </span>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="category.html">Category</a></li>
        <li><a href="Dashboard/login.html">Login</a></li>
    </ul>
    <div class="input-box">
      <input type="text" placeholder="Email">
      <button type="submit">Subscribe</button>
    </div>
  </footer>

  <script src="src/db.js"></script>
  <script src="src/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const img = document.getElementById("postImg");
      const header = document.getElementById("postHeader");
      const body = document.getElementById("postBody");
      const backBtn = document.getElementById("backBtn");

      if (backBtn) {
        backBtn.addEventListener("click", () => {
          window.location.href = "index.html";
        });
      }

      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');

      if (id && window.DB) {
        const post = window.DB.getPostById(id);
        if (post) {
          if (img) img.src = post.image || "https://picsum.photos/600/400";
          if (header) header.textContent = post.title;
          if (body) body.innerHTML = post.content ? post.content.replace(/\n/g, "<br><br>") : "No content available.";
        } else {
          if (body) body.textContent = "Error: Article not found.";
        }
      } else {
        if (body) body.textContent = "Error: Invalid post selection.";
      }
    });
  </script>
</body>
</html>
