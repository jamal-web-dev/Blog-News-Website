<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Add Unlimited Post</title>
  <link rel="stylesheet" href="styles/index.css">
  <link rel="stylesheet" href="styles/add_post.css">

</head>
<body>
  <div class="header">
    <button class="show-side-bar">Show/Hide Bar</button>
    <span class="logo">
      Blog<span>Lab</span>
    </span>

    <a href="login.html">Sign Out</a>
  </div>
  <div class="side-bar">
    <ul>
      <a href="index.html"><li>Overview</li></a>
      <a href="add_post.html"><li class="active">ِAdd Post</li></a>
      <a href="manage_post.html"><li>Manage Posts</li></a>
      <a href="add_category.html"><li>ِAdd Categoy</li></a>
      <a href="manage_category.html"><li>Manage Categories</li></a>
    </ul>
  </div>
  <section>
    <!-- ========= Your Code here -->
     <div class="add-post-container">

  <div class="page-header">
    <h1>Add New Post</h1>
    <p>Create and publish a new news article</p>
  </div>

  <form id="postForm" class="add-post-form">

    <div class="form-group">
      <label>Post Title</label>
      <input type="text" id="title" placeholder="Enter post title" required>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>Category</label>
        <select id="category">
          <option>Politics</option>
          <option>Technology</option>
          <option>Sports</option>
          <option>Entertainment</option>
          <option>Business</option>
        </select>
      </div>

      <div class="form-group">
        <label>Author</label>
        <input type="text" id="author" placeholder="Author name">
      </div>
    </div>

    <div class="form-group">
      <label>Upload Image</label>
      <input type="file" id="image" accept="image/*">
    </div>

    <div class="form-group">
      <label>Content</label>
      <textarea id="content" placeholder="Write your news article..."></textarea>
    </div>

    <div class="form-group">
      <label>Tags</label>
      <input type="text" id="tags" placeholder="e.g news, world, politics">
    </div>

    <div class="form-group">
      <label>Status</label>
      <select id="status">
        <option value="draft">Draft</option>
        <option value="published">Published</option>
      </select>
    </div>

    <div class="actions">
      <button type="submit" class="btn primary">Publish Post</button>
      <button type="reset" class="btn secondary">Clear</button>
    </div>

  </form>

  <div class="api-preview" id="previewBox"></div>

</div>
  </section>
  <script src="src/add_post.js"></script>
  <script src="src/index.js"></script>
</body>
</html>
